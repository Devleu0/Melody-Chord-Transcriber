name: Feature request / 기능 제안
description: Suggest an idea / 아이디어 제안
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve? / 어떤 문제를 해결하나요?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution / 제안하는 방법
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 고려한 다른 방법
