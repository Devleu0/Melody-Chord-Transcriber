[project]
name = "melody-chord-transcriber-backend"
version = "0.1.0"
description = "Audio (any yt-dlp URL or local file) -> stem separation -> melody & chord transcription API"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart",  # file uploads
    "yt-dlp[default]",
    # CUDA build of onnxruntime on Windows/Linux, CPU build on macOS
    "audio-separator[gpu]; sys_platform != 'darwin'",
    "audio-separator[cpu]; sys_platform == 'darwin'",
    "basic-pitch",
    "torch",
    "torchaudio",
    "librosa",
    "soundfile",
    "pretty_midi",
    "huggingface_hub",
    "music21",
]

[tool.uv]
package = false
# basic-pitch runs its bundled ONNX model through onnxruntime, so TensorFlow/CoreML/TFLite are not needed
override-dependencies = [
    "tensorflow; sys_platform == 'never'",
    "tensorflow-macos; sys_platform == 'never'",
    "tflite-runtime; sys_platform == 'never'",
    "coremltools; sys_platform == 'never'",
]

# CUDA 12.6 wheels on Windows/Linux; macOS uses the default PyPI wheels
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }]
torchaudio = [{ index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
